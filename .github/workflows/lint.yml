name: Node.js build

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x, 24.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run lint
            # Offline: answers come from recorded responses in tests/fixtures/http.
            - run: npm test
            # Obsidian's automated review lints without moment's type package
            # installed; repeat that here so unresolved types are caught first.
            - name: Lint as Obsidian's review does (without moment types)
              run: rm -rf node_modules/moment && npm run lint
